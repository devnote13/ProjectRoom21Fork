<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🔥 Casino Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

<h1 class="title">🔥 Casino Admin Dashboard</h1>

<!-- ================= STATS ================= -->
<div class="stats">
    <div class="stat">👤 Users: <span id="totalUsers">0</span></div>
    <div class="stat">💰 Chips: <span id="totalChips">0</span></div>
    <div class="stat">💸 Withdrawn: <span id="totalWithdrawn">0</span></div>
    <div class="stat profit">📈 Profit: <span id="profit">0</span></div>
</div>

<!-- ================= CONTROLS ================= -->
<div class="controls">
    <input id="searchInput" placeholder="Search user..." />
    
    <select id="sortSelect">
        <option value="chips">Sort by Chips</option>
        <option value="username">Sort by Username</option>
    </select>

    <button onclick="refresh()">Refresh</button>
</div>

<!-- ================= GRID ================= -->
<div class="grid">

    <!-- USERS -->
    <div class="panel">
        <h2>👤 Users</h2>
        <div id="users"></div>
    </div>

    <!-- WITHDRAW -->
    <div class="panel">
        <h2>💸 Withdraw Requests</h2>
        <div id="withdraws"></div>
    </div>

    <!-- LEADERBOARD -->
    <div class="panel">
        <h2>🏆 Top Players</h2>
        <div id="leaderboard"></div>
    </div>

</div>

<script>
const API = "http://localhost:3000";
const token = localStorage.getItem("token");

// ================= STATS =================
async function loadStats() {
    try {
        const res = await fetch(`${API}/admin/stats`, {
            headers: { Authorization: "Bearer " + token }
        });

        const data = await res.json();
        if (!data.success) return;

        document.getElementById("totalUsers").textContent = data.stats.totalUsers;
        document.getElementById("totalChips").textContent = data.stats.totalChips;
        document.getElementById("totalWithdrawn").textContent = data.stats.totalWithdrawn;
        document.getElementById("profit").textContent = data.stats.profit;

    } catch (err) {
        console.error(err);
    }
}

// ================= USERS =================
async function loadUsers() {

    const search = document.getElementById("searchInput").value || "";
    const sort = document.getElementById("sortSelect").value;

    const res = await fetch(`${API}/admin?search=${search}&sort=${sort}`, {
        headers: { Authorization: "Bearer " + token }
    });

    const data = await res.json();
    if (!data.success) return;

    document.getElementById("users").innerHTML = data.users.map(u => `
        <div class="card ${u.banned ? "banned" : ""}">
            <b>${u.username}</b><br>
            ${u.email}<br>
            💰 Chips: <b>${u.chips}</b><br>
            Role: ${u.role}

            <div class="btns">
                ${u.banned
                    ? `<button onclick="unban('${u.id}')">Unban</button>`
                    : `<button class="danger" onclick="ban('${u.id}')">Ban</button>`
                }
            </div>
        </div>
    `).join("");
}

// ================= WITHDRAW =================
async function loadWithdraws() {

    const res = await fetch(`${API}/admin/withdraws`, {
        headers: { Authorization: "Bearer " + token }
    });

    const data = await res.json();
    if (!data.success) return;

    document.getElementById("withdraws").innerHTML = data.requests.map(r => `
        <div class="card">
            <b>${r.username}</b><br>
            💸 ${r.amount} chips<br>
            <span class="status ${r.status}">${r.status}</span>

            ${r.status === "pending" ? `
                <div class="btns">
                    <button class="yes" onclick="approve('${r.username}')">Approve</button>
                    <button class="no" onclick="reject('${r.username}')">Reject</button>
                </div>
            ` : ""}
        </div>
    `).join("");
}

// ================= LEADERBOARD =================
async function loadLeaderboard() {

    const res = await fetch(`${API}/admin`, {
        headers: { Authorization: "Bearer " + token }
    });

    const data = await res.json();
    if (!data.success) return;

    const sorted = data.users.sort((a, b) => b.chips - a.chips);

    document.getElementById("leaderboard").innerHTML =
        sorted.slice(0, 10).map((u, i) => `
            <div class="card ${i === 0 ? "top" : ""}">
                #${i + 1} <b>${u.username}</b><br>
                ${u.chips} chips
            </div>
        `).join("");
}

// ================= ACTIONS =================
async function approve(username) {
    await fetch(`${API}/admin/withdraw/approve-user`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
        },
        body: JSON.stringify({ username })
    });

    refresh();
}

async function reject(username) {
    await fetch(`${API}/admin/withdraw/reject-user`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
        },
        body: JSON.stringify({ username })
    });

    refresh();
}

// ================= BAN =================
async function ban(userId) {
    await fetch(`${API}/admin/ban-user`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
        },
        body: JSON.stringify({ userId })
    });

    refresh();
}

async function unban(userId) {
    await fetch(`${API}/admin/unban-user`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
        },
        body: JSON.stringify({ userId })
    });

    refresh();
}

// ================= REFRESH =================
function refresh() {
    loadUsers();
    loadWithdraws();
    loadLeaderboard();
    loadStats();
}

// ================= EVENTS =================
document.getElementById("searchInput").addEventListener("input", refresh);
document.getElementById("sortSelect").addEventListener("change", refresh);

// ================= INIT =================
refresh();
setInterval(refresh, 5000);
</script>

</body>
</html>
