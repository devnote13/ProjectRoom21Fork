<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Snow Fall</title>

    <link rel="stylesheet" href="main.css">
</head>

<body>

    <div class="side-menu" id="sideMenu">

        <!-- TOP RIGHT HEADER -->
        <div class="menu-top">

            <div class="menu-logo">
                <img src="favicon.ico" alt="Snow Fall Casino">
            </div>

            <button class="GobackBtn">
                <img src="Goback.png" alt="Go back">
            </button>

        </div>

        <!-- LINKS -->
        <div class="menu-links">
            <a href="http://localhost:3000/" class="menu-item"><img src="Home.png" width="18" height="18"> Home</a>
            <a href="#" class="menu-item"><img src="Account.png" width="20" height="20"> Account</a>
            <a href="#" class="menu-item"><img src="PlayAgain.png" width="20" height="20"> Play Again</a>
            <a href="#" class="menu-item"><img src="Note.png" width="20" height="20"> My Bets</a>
            <a href="#" class="menu-item"><img src="Coin2.png" width="20" height="20"> Chips</a>

            <div class="menu-divider"></div>

            <a href="http://localhost:3000/index.html#classics" class="menu-item"><img src="ClassicDimond.png" width="20" height="20"> Classics</a>
            <a href="http://localhost:3000/index.html#Hotgames" class="menu-item"><img src="fire.png" width="20" height="20"> Top Trending</a>
            <a href="http://localhost:3000/index.html#Allgames" class="menu-item"><img src="AllGames.png" width="20" height="20"> All Games</a>
        </div>

    </div>

    <div class="content">

        <!-- TOP BAR -->
        <div class="top-container">

            <div class="left-group">
                <button class="dot-menu" id="menuBtn">
                    <img src="dots-menu.png">
                </button>
                <h1 class="TopTitle">Snow Fall Casino</h1>
            </div>

            <div class="right-group">

                <div class="chip-container">
                    <span class="Chip-label"><img src="Coin.png"> 0 Chips</span>
                    <button class="AddChipBtn"><img src="plus.png"></button>
                </div>

                <div class="signbtns">
                    <a href="signup.html">
                        <button class="Signupbtn">Sign Up</button>
                    </a>
                    <a href="signin.html">
                        <button class="Signinbtn">Sign In</button>
                    </a>
                </div>

                <div class="user-profile" style="display:none;">
                    <input type="file" id="avatarInput" accept="image/*" hidden>

                    <span class="UsernameDisplay"></span>

                    <label for="avatarInput" class="avatar-label">
                        <img class="UserAvatar" src="default.png" alt="Avatar">
                    </label>
                </div>

            </div>

        </div>

<div class="divider"></div>

<div class="content">

    <div class="account-page">

        <!-- ================= HEADER (FLUSH) ================= -->
        <div class="account-header flush">

            <label for="avatarInput" class="avatar-wrapper">
                <img class="account-avatar" src="default.png" alt="avatar">
                <input type="file" id="avatarInput" accept="image/*" hidden>
            </label>

            <div class="account-info">
                <h3 class="account-name">Guest</h3>
                <p class="account-email">Not signed in</p>
            </div>

            <button class="logoutBtn">
                <img src="logout.png" alt="logout">
            </button>

        </div>

        <!-- ================= CHIPS ================= -->
        <div class="account-stats">
            Chips: <span class="account-chips">0</span>
        </div>

        <!-- ================= PROFILE SECTION ================= -->
        <div class="account-section">

            <h2>Profile</h2>

            <div class="grid">

                <button class="acc-btn">Change Username</button>
                <button class="acc-btn">Change Email</button>
                <button class="acc-btn">Change Password</button>
                <button class="acc-btn">Upload Avatar</button>

            </div>

        </div>


    </div>

</div>


<!-- SCRIPTS -->
<script src="account.js"></script>
<script src="main.js"></script>

</body>
</html>
