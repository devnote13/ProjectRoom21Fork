<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="main.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Again - Snow Fall</title>
</head>

<body>

<!-- SIDE MENU -->
<div class="side-menu" id="sideMenu">

    <div class="menu-top">

        <div class="menu-logo">
            <img src="favicon.ico" alt="Snow Fall Casino">
        </div>

        <button class="GobackBtn">
            <img src="Goback.png" alt="Go back">
        </button>

    </div>

    <div class="menu-links">

        <a href="http://localhost:3000/" class="menu-item">
            <img src="Home.png" width="18" height="18"> Home
        </a>

        <a href="account.html" class="menu-item">
            <img src="Account.png" width="20" height="20"> Account
        </a>

        <a href="PlayAgain.html" class="menu-item">
            <img src="PlayAgain.png" width="20" height="20"> Play Again
        </a>

        <a href="MyBets.html" class="menu-item">
            <img src="Note.png" width="20" height="20"> My Bets
        </a>

        <a href="Chips.html" class="menu-item">
            <img src="Coin2.png" width="20" height="20"> Chips
        </a>

        <div class="menu-divider"></div>

        <a href="http://localhost:3000/index.html#classics" class="menu-item">
            <img src="ClassicDimond.png" width="20" height="20"> Classics
        </a>

        <a href="http://localhost:3000/index.html#Hotgames" class="menu-item">
            <img src="fire.png" width="20" height="20"> Top Trending
        </a>

        <a href="http://localhost:3000/index.html#Allgames" class="menu-item">
            <img src="AllGames.png" width="20" height="20"> All Games
        </a>

    </div>

</div>

<!-- MAIN CONTENT -->
<div class="content">

    <!-- TOP BAR -->
    <div class="top-container">

        <div class="left-group">
            <button class="dot-menu" id="menuBtn">
                <img src="dots-menu.png">
            </button>
            <h1 class="TopTitle">Snow Fall Casino</h1>
        </div>

        <div class="right-group">

            <div class="chip-container">
                <span class="Chip-label">
                    <img src="Coin.png"> 0 Chips
                </span>
                <button class="AddChipBtn">
                    <img src="plus.png">
                </button>
            </div>

            <div class="signbtns">
                <a href="signup.html">
                    <button class="Signupbtn">Sign Up</button>
                </a>

                <a href="signin.html">
                    <button class="Signinbtn">Sign In</button>
                </a>
            </div>

            <div class="user-profile" style="display:none;">
                <input type="file" id="avatarInput" accept="image/*" hidden>

                <span class="UsernameDisplay"></span>

                <label for="avatarInput" class="avatar-label">
                    <img class="UserAvatar" src="default.png" alt="Avatar">
                </label>
            </div>

        </div>

    </div>

    <div class="divider"></div>

    <!-- GAME HISTORY SECTION (IMPORTANT) -->
    <section class="section">

        <h2 class="sectionheader">Game History</h2>

        <!-- JS WILL INSERT HORIZONTAL CARDS HERE -->
        <div class="history-grid"></div>

    </section>

</div>

<!-- SCRIPTS -->
<script src="account.js"></script>
<script src="PlayAgain.js"></script>

</body>
</html>
